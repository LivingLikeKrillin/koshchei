<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520">
  <defs>
    <marker id="data" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#262626" stroke-width="1.2"/></marker>
    <marker id="obs" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1,1 L8,5 L1,9" fill="none" stroke="#6f6f6f" stroke-width="1.2"/></marker>
  </defs>
  <g font-family="'Helvetica Neue', Helvetica, Arial, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" fill="#262626">
    <text x="20" y="36" font-size="17" font-weight="700">From bundle to episode</text>
    <text x="20" y="56" font-size="12" fill="#6f6f6f">From one bundle, CLI passes one row; watcher passes two correlated rows</text>
    <rect x="24" y="88" width="288" height="256" fill="none" stroke="#bdbdbd"/>
    <text x="36" y="104" font-size="11" fill="#6f6f6f" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">run-1/</text>
    <text x="84" y="104" font-size="11" fill="#6f6f6f">picasso bundle</text>
    <rect x="40" y="116" width="256" height="52" fill="#ffffff" stroke="#bdbdbd"/>
    <text x="52" y="137" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">manifest.json</text>
    <text x="52" y="153" font-size="11" fill="#6f6f6f" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">runId · counts 9/4</text>
    <rect x="40" y="196" width="256" height="52" fill="#ffffff" stroke="#bdbdbd"/>
    <text x="52" y="217" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">remedy-searches.jsonl</text>
    <text x="52" y="233" font-size="11" fill="#6f6f6f" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">search-1 · hum-02 · PATROL-1 · FOUND</text>
    <rect x="40" y="276" width="256" height="52" fill="#ffffff" stroke="#bdbdbd"/>
    <text x="52" y="297" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">incidents.jsonl</text>
    <text x="52" y="313" font-size="11" fill="#6f6f6f" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">incident-1 · hum-02 · PATROL-1</text>
    <rect x="40" y="372" width="256" height="52" fill="#ffffff" stroke="#bdbdbd" stroke-dasharray="5 3"/>
    <text x="52" y="393" font-size="12" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">job-responses.jsonl</text>
    <text x="52" y="409" font-size="11" fill="#6f6f6f">Outside bundle · arrives later</text>
    <rect x="394" y="116" width="180" height="52" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="406" y="137" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">:host:cli open</text>
    <text x="406" y="153" font-size="11" fill="#6f6f6f" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">--search search-1</text>
    <rect x="394" y="236" width="180" height="68" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="406" y="257" font-size="12.5" font-weight="700">Watcher</text>
    <text x="406" y="273" font-size="11" fill="#6f6f6f" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">:host:watcher</text>
    <text x="406" y="289" font-size="11" fill="#6f6f6f">Match robotId + jobOrderId</text>
    <rect x="656" y="116" width="160" height="68" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="668" y="137" font-size="12" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">ep:koshchei-demo-1</text>
    <text x="668" y="155" font-size="11" fill="#6f6f6f">Only search-1</text>
    <text x="668" y="171" font-size="11" fill="#6f6f6f">passed as a symptom</text>
    <rect x="656" y="236" width="160" height="68" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="668" y="257" font-size="12.5" font-weight="700">Watcher-opened</text>
    <text x="668" y="273" font-size="12.5" font-weight="700">episode</text>
    <text x="668" y="291" font-size="11" fill="#6f6f6f">search-1 + incident-1</text>
    <path d="M296,208 H340 V142 H392" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="346" y="200" font-size="10.5">Select one row</text>
    <path d="M296,240 H392" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <path d="M296,300 H356 V284 H392" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="362" y="318" font-size="10.5">Correlate</text>
    <path d="M574,142 H654" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="580" y="134" font-size="10.5">Open episode</text>
    <path d="M574,270 H654" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="580" y="262" font-size="10.5">Open episode</text>
    <path d="M296,398 H484 V306" fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="312" y="390" font-size="10.5" fill="#6f6f6f">Pass job response</text>
    <text x="816" y="456" font-size="11" fill="#6f6f6f" text-anchor="end">Raw manifest included in episode and diagnosis request</text>
    <text x="816" y="472" font-size="11" fill="#6f6f6f" text-anchor="end">Unparsed fields kept verbatim · shown in symptom list</text>
    <path d="M20,500 H44" fill="none" stroke="#262626" stroke-width="1.2"/>
    <text x="52" y="504" font-size="10.5" fill="#6f6f6f">Pass symptoms</text>
    <path d="M140,500 H164" fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="172" y="504" font-size="10.5" fill="#6f6f6f">Arrives later</text>
    <rect x="260" y="492" width="16" height="12" fill="none" stroke="#bdbdbd"/>
    <text x="284" y="504" font-size="10.5" fill="#6f6f6f">Three bundle files</text>
    <rect x="400" y="492" width="16" height="12" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="424" y="504" font-size="10.5" fill="#6f6f6f">koshchei</text>
  </g>
