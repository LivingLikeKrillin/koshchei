    <rect x="270" y="432" width="300" height="60" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="282" y="454" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">DISPATCH_PENDING</text>
    <text x="282" y="472" font-size="11" fill="#6f6f6f">Record dispatch intent first</text>
    <rect x="270" y="516" width="300" height="60" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
