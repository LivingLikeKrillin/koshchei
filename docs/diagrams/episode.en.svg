    <text x="20" y="56" font-size="12" fill="#6f6f6f">Operator decides approval and completion; timeouts hand control to the operator</text>
    <rect x="270" y="96" width="300" height="60" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
