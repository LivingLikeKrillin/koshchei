    <text x="282" y="552" font-size="11" fill="#6f6f6f">Mock approval client reply</text>
    <text x="282" y="567" font-size="11" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">APPROVED · mock-exec-1</text>
    <rect x="270" y="600" width="300" height="60" fill="#e8ebf3" stroke="#2b3f6b" stroke-width="1.5"/>
    <text x="282" y="622" font-size="12.5" font-weight="700" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace">AWAITING_EVIDENCE</text>
