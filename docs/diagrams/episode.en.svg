    <path d="M570,630 H664 V196 H572" fill="none" stroke="#b23a1d" stroke-width="2" marker-end="url(#cmd)"/>
    <text x="670" y="420" font-size="10.5" fill="#b23a1d">NOT DONE · rediagnose</text>
    <path d="M270,294 H124 V430" fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="132" y="370" font-size="10.5" fill="#6f6f6f">5 min timeout</text>
    <path d="M270,630 H124 V494" fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#obs)"/>
    <text x="132" y="570" font-size="10.5" fill="#6f6f6f">10 min timeout</text>
    <path d="M60,492 V682" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <text x="68" y="664" font-size="10.5">Operator closes / 24 h</text>
    <text x="816" y="772" font-size="11" fill="#6f6f6f" text-anchor="end">Whole episode deadline: 1 h → ESCALATED</text>
    <text x="816" y="788" font-size="11" fill="#6f6f6f" text-anchor="end">Takeover in any phase → ESCALATED</text>
    <path d="M20,816 H44" fill="none" stroke="#262626" stroke-width="1.2"/>
    <text x="52" y="820" font-size="10.5" fill="#6f6f6f">Automatic</text>
    <path d="M140,816 H164" fill="none" stroke="#b23a1d" stroke-width="2"/>
    <text x="172" y="820" font-size="10.5" fill="#6f6f6f">Operator</text>
    <path d="M260,816 H284" fill="none" stroke="#6f6f6f" stroke-width="1.2" stroke-dasharray="5 3"/>
    <text x="292" y="820" font-size="10.5" fill="#6f6f6f">Timeout</text>
    <rect x="380" y="808" width="16" height="12" fill="#ffffff" stroke="#262626" stroke-width="2"/>
    <text x="404" y="820" font-size="10.5" fill="#6f6f6f">Terminal phase</text>
