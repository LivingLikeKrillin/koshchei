    <text x="428" y="339" font-size="10.5" fill="#b23a1d">Approve</text>
    <path d="M420,408 V430" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <path d="M420,492 V514" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <path d="M420,576 V598" fill="none" stroke="#262626" stroke-width="1.2" marker-end="url(#data)"/>
    <path d="M420,660 V682" fill="none" stroke="#b23a1d" stroke-width="2" marker-end="url(#cmd)"/>
    <text x="428" y="675" font-size="10.5" fill="#b23a1d">Confirm DONE</text>
    <path d="M570,294 H600 V214 H572" fill="none" stroke="#b23a1d" stroke-width="2" marker-end="url(#cmd)"/>
